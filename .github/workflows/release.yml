name: Build and Release (Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '可选。手动触发时使用的发布标签；留空则自动生成 vYYYYMMDDHHMMSS。'
        required: false

permissions:
  contents: write

env:
  # 上传到 Release 的产物 glob（build.bat 产出 dist/StickerGenie-<版本>.zip）
  ARTIFACTS: 'dist/StickerGenie-*.zip'
  # 构建使用的 Python 版本
  PYTHON_VERSION: '3.13'

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      # 1. 拉取主仓库（完整历史 + LFS 对象）
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true

      # 2. 拉取模型仓库（.onnx 模型文件）
      #    若 StickerGenie-models 为私有仓库且 GITHUB_TOKEN 无访问权限，改用它: ${{ secrets.PAT_FOR_MODELS }}
      #    windows-latest 自带 git-lfs，actions/checkout 的 lfs: true 会在拉取时自动下载 LFS 对象，无需手动安装
      - name: Checkout models repository
        uses: actions/checkout@v7
        with:
          repository: Craftkuro/StickerGenie-models
          path: models
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          lfs: true

      # 3. 配置 Python（带 pip 依赖缓存）
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. 将模型仓库中的 .onnx 文件复制进 src/（PyInstaller 打包需要）
      - name: Copy .onnx models into src/
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path src -Force | Out-Null
          $onnx = @(Get-ChildItem -Path models -Filter '*.onnx' -Recurse -File)
          if ($onnx.Count -eq 0) {
            Write-Error '未在 models 仓库中找到 .onnx 文件'
            exit 1
          }
          $onnx | Copy-Item -Destination src -Force
          Get-ChildItem -Path src -Filter '*.onnx' | ForEach-Object { Write-Host "Model: $($_.Name)" }

      # 5. 构建：产出 dist/StickerGenie-<版本>.zip
      - name: Run build
        shell: cmd
        run: call build.bat

      # 6. 确定发布标签
      #    push tag 事件：使用被推送的 tag；手动触发：使用输入或自动生成，若 tag 不存在则创建并推送（已存在则复用）
      - name: Resolve release tag
        id: tag
        shell: pwsh
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $tag = $env:INPUT_TAG
            if ([string]::IsNullOrWhiteSpace($tag)) {
              $tag = 'v' + (Get-Date -Format 'yyyyMMddHHmmss')
            }
            $tag = $tag.Trim()
            Write-Host "手动触发，使用标签: $tag"

            git fetch origin --tags --force --prune
            if (git rev-parse -q --verify "refs/tags/$tag") {
              Write-Host "标签 $tag 已存在，跳过创建"
            } else {
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -a $tag -m "Release $tag"
              git push origin $tag
            }
          } else {
            $tag = $env:REF_NAME
            Write-Host "push 事件，使用标签: $tag"
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "tag_name=$tag"

      # 7. 创建 / 更新 GitHub Release 并上传构建产物（release notes 自动生成，对比上一个 tag 的提交）
      - name: Create / update GitHub release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: ${{ steps.tag.outputs.tag_name }}
          files: ${{ env.ARTIFACTS }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
