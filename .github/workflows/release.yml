name: Build and Release (Windows)

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  # Glob that matches your versioned zip (e.g., dist/StickerGenie-1.0.0.zip)
  ARTIFACTS: 'dist/StickerGenie-*.zip'

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout models repository
        uses: actions/checkout@v4
        with:
          repository: Craftkuro/StickerGenie-models
          path: models
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure src/ exists and copy .onnx model files into src/
        shell: pwsh
        run: |
          Write-Host "Ensuring src/ directory exists"
          New-Item -ItemType Directory -Path src -Force | Out-Null

          Write-Host "Copying .onnx files from models/ to src/"
          $onnx = Get-ChildItem -Path models -Filter '*.onnx' -Recurse -File -ErrorAction SilentlyContinue
          if (-not $onnx) {
            Write-Host "No .onnx files found in models repository"
            exit 1
          }
          foreach ($f in $onnx) {
            $dest = Join-Path -Path (Resolve-Path src).Path -ChildPath $f.Name
            Write-Host "Copying $($f.FullName) -> $dest"
            Copy-Item -Path $f.FullName -Destination $dest -Force
          }

      - name: List files in src/ (debug)
        shell: pwsh
        run: |
          Write-Host "src/ contents (first 200):"
          Get-ChildItem -Path src -File -Recurse | Sort-Object FullName | Select-Object FullName -First 200

      - name: Run build
        shell: cmd
        run: |
          REM Ensure this runs from repository root
          echo Running build.bat
          call build.bat

      - name: Find build artifact
        id: find_artifact
        shell: pwsh
        run: |
          Write-Host "Looking for artifacts matching: $env:ARTIFACTS"
          $pattern = $env:ARTIFACTS
          $dir = Split-Path -Path $pattern -Parent
          $leaf = Split-Path -Path $pattern -Leaf

          # If the pattern has no explicit directory, search the workspace
          if ([string]::IsNullOrWhiteSpace($dir) -or $dir -eq '.') {
            $dir = "$PWD"
          } else {
            # Resolve relative path
            $dir = Resolve-Path $dir -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $dir) {
              Write-Host "Directory '$dir' does not exist for pattern: $pattern"
              exit 1
            } else {
              $dir = $dir.Path
            }
          }

          $matches = Get-ChildItem -Path $dir -Filter $leaf -Recurse -File -ErrorAction SilentlyContinue
          if (-not $matches) {
            Write-Host "No artifacts found for pattern '$pattern'"
            exit 1
          }

          # If multiple matches, pick the first (sorted) — adjust if you want a different selection rule
          $file = $matches | Sort-Object FullName | Select-Object -First 1
          $full = $file.FullName
          $name = $file.Name

          Write-Host "Found artifact: $full"
          Write-Host "artifact_path=$full" >> $env:GITHUB_OUTPUT
          Write-Host "artifact_name=$name" >> $env:GITHUB_OUTPUT

      - name: Upload artifact for release
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.find_artifact.outputs.artifact_name }}
          path: ${{ steps.find_artifact.outputs.artifact_path }}

      - name: Create GitHub release and attach artifact
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          artifact: ${{ steps.find_artifact.outputs.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
