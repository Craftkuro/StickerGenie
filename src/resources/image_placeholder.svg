<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <!-- 4:3 placeholder: transparent background + Windows-style image icon (outer gray border added by caller) -->

  <g transform="translate(100 75)">
    <!-- card shadow -->
    <rect x="3" y="6" width="200" height="150" rx="14" fill="#000000" opacity="0.06"/>

    <!-- white image card -->
    <rect x="0" y="0" width="200" height="150" rx="14" fill="#ffffff" stroke="#d9d9d9" stroke-width="1.5"/>

    <!-- photo area -->
    <clipPath id="photoClip">
      <rect x="12" y="12" width="176" height="126" rx="8"/>
    </clipPath>
    <g clip-path="url(#photoClip)">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#c9e4f8"/>
          <stop offset="1" stop-color="#f1f9fd"/>
        </linearGradient>
      </defs>
      <rect x="12" y="12" width="176" height="126" fill="url(#sky)"/>

      <!-- sun -->
      <circle cx="38" cy="37" r="18" fill="#ffd357" opacity="0.3"/>
      <circle cx="38" cy="37" r="13" fill="#ffd357"/>

      <!-- cloud -->
      <g fill="#ffffff" opacity="0.85">
        <ellipse cx="72" cy="32" rx="20" ry="7"/>
        <circle cx="62" cy="27" r="8"/>
        <circle cx="80" cy="26" r="9"/>
      </g>

      <!-- back mountains -->
      <path d="M12 138 L50 75 L85 110 L110 85 L150 125 L188 103 L188 138 Z" fill="#7fb06a"/>

      <!-- front hills -->
      <path d="M12 138 L65 95 L105 120 L140 97 L188 125 L188 138 Z" fill="#a9cf86"/>
    </g>

  </g>
</svg>