      <stop offset="0" stop-color="#143d50"/>
      <stop offset="0.55" stop-color="#0e2c3d"/>
      <stop offset="1" stop-color="#081a26"/>
    </linearGradient>
    <linearGradient id="frontPhotoBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4f7a0"/>
      <stop offset="0.52" stop-color="#8cd158"/>
      <stop offset="1" stop-color="#5fa332"/>
    </linearGradient>
    <clipPath id="backClip">
      <rect x="95" y="95" width="322" height="312" rx="14"/>
    </clipPath>
    <clipPath id="frontClip">
      <rect x="86" y="86" width="340" height="330" rx="14"/>
