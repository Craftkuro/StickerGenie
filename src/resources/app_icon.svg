      <path d="M 86 348 C 180 310, 320 302, 426 340 L 426 416 L 86 416 Z" fill="#6da33a" opacity="0.34"/>
      <rect x="86" y="86" width="340" height="330" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.35"/>
