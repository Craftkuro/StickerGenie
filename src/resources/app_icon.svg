    <rect x="81" y="81" width="350" height="350" rx="20" fill="#fffdf7"/>
    <g clip-path="url(#backClip)">
      <rect x="95" y="95" width="322" height="312" fill="url(#backPhotoBg)"/>
      <path d="M 95 330 C 170 300, 280 290, 417 318 L 417 407 L 95 407 Z" fill="#0a2430" opacity="0.32"/>
      <rect x="95" y="95" width="322" height="312" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.16"/>
