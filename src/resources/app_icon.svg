      <use href="#petal" transform="rotate(75)" fill="#ffffff"/>
      <use href="#petal" transform="rotate(135)" fill="#ffffff"/>
      <use href="#petal" transform="rotate(195)" fill="#ffffff"/>
      <use href="#petal" transform="rotate(255)" fill="#ffffff"/>
      <use href="#petal" transform="rotate(315)" fill="#ffffff"/>
      <circle cx="0" cy="0" r="20" fill="#fdd835"/>
