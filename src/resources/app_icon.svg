        <use href="#petal" transform="rotate(75)"/>
        <use href="#petal" transform="rotate(135)"/>
        <use href="#petal" transform="rotate(195)"/>
        <use href="#petal" transform="rotate(255)"/>
        <use href="#petal" transform="rotate(315)"/>
